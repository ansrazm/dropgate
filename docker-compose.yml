services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: dropgate
      POSTGRES_PASSWORD: dropgate
      POSTGRES_DB: dropgate
    ports:
      - "5434:5432"
    volumes:
      - dropgate-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropgate -d dropgate"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  dropgate-pgdata:
